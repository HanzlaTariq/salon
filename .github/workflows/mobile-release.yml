name: Mobile release build

# Manual. Builds a SIGNED Android App Bundle (.aab) for Google Play and, optionally, checks that the iOS project compiles.
# iOS signing and the App Store upload still happen on a Mac (Xcode or Codemagic): docs/RELEASE_MOBILE.md.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64       base64 of upload-keystore.jks        (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload-keystore.jks")))
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_PASSWORD       key password
#   ANDROID_KEY_ALIAS          key alias (upload)
# Repository VARIABLE:
#   API_BASE_URL               https://api.yourdomain.com/api/v1
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [customer, business]
        required: true
      build_ios:
        description: Also compile the iOS project (no signing)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: ${{ inputs.app }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Check the build settings
        run: |
          case "$API_BASE_URL" in https://*) ;; *) echo "Repository variable API_BASE_URL must start with https://"; exit 1;; esac
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v"; exit 1; fi
          done
      - name: Prepare the app for release (idempotent)
        run: node tool/prepare-mobile-release.mjs "$APP"
      - name: Write the signing files (never printed, removed at the end)
        run: |
          dir="apps/$([ "$APP" = customer ] && echo customer_app || echo business_app)/android"
          echo "$KEYSTORE_B64" | base64 -d > "$dir/app/upload-keystore.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$dir/key.properties"
      - name: Build the signed App Bundle
        run: |
          cd "apps/$([ "$APP" = customer ] && echo customer_app || echo business_app)"
          flutter pub get
          if [ "$APP" = business ]; then dart run build_runner build --delete-conflicting-outputs; fi
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-android-release
          retention-days: 30
          path: |
            apps/*/build/app/outputs/bundle/release/*.aab
            apps/*/build/app/outputs/mapping/release/mapping.txt
            apps/*/build/symbols
      - name: Remove the signing files
        if: always()
        run: rm -f apps/*/android/app/upload-keystore.jks apps/*/android/key.properties

  ios-compile-check:
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: ${{ inputs.app }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Check the build settings
        run: |
          case "$API_BASE_URL" in https://*) ;; *) echo "Repository variable API_BASE_URL must start with https://"; exit 1;; esac
      - run: node tool/prepare-mobile-release.mjs "$APP"
      - name: Compile (no code signing)
        run: |
          cd "apps/$([ "$APP" = customer ] && echo customer_app || echo business_app)"
          flutter pub get
          if [ "$APP" = business ]; then dart run build_runner build --delete-conflicting-outputs; fi
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"
