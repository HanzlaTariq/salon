name: Database backup (encrypted)

# Daily encrypted dump of the Supabase database (Free plan has no automated backups). The file is encrypted with the PUBLIC age key
# before it leaves the runner: whoever reads the artifact (including GitHub) cannot open it. The PRIVATE key stays offline.
# The repository MUST be private. Secrets needed (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL     Supabase SESSION pooler URL for user postgres.<ref> (port 5432). Needs BYPASSRLS = the `postgres` role.
#   BACKUP_AGE_RECIPIENT    age public key (age1...). Create the pair on YOUR computer: age-keygen -o age.key
on:
  schedule:
    - cron: '30 21 * * *'   # 02:30 Pakistan time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DIR: backups
          PATH_PG: /usr/lib/postgresql/17/bin
        run: |
          export PATH="$PATH_PG:$PATH"
          bash infra/backup/backup.sh
      - uses: actions/upload-artifact@v7
        with:
          name: salon-db-backup
          path: backups/
          retention-days: 14
          if-no-files-found: error
