name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: ci_only, POSTGRES_DB: salon }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      DIRECT_URL: postgresql://x:x@localhost:5432/x
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      MFA_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seTE=
      TEST_DATABASE_URL: postgresql://salon_app:salon_app_dev_pw@localhost:5432/salon
      TEST_ADMIN_DATABASE_URL: postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - name: Create least-privilege roles (same script as local docker-compose)
        run: PGPASSWORD=ci_only psql -h localhost -U postgres -d salon -f ../../infra/postgres/init/01-roles.sql
      - name: Apply migrations as the migrator role
        run: DIRECT_URL="postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon" DATABASE_URL="postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon" npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Security e2e (auth, RBAC, tenancy, rate limits) against real PostgreSQL
        run: npm run test:e2e
      - run: npm run build
      - name: Dependency audit (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  flutter-core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/flutter_core } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Newer Flutter (3.47+) reports package:flutter/material.dart as a deprecated INFO. Infos no longer fail the job;
      # warnings and errors still do. The material_ui migration is a separate, planned change.
      - run: flutter analyze --no-fatal-infos

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
