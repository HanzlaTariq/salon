name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: ci_only, POSTGRES_DB: salon }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
      DIRECT_URL: postgresql://x:x@localhost:5432/x
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      MFA_ENCRYPTION_KEY: Y2ktb25seS1rZXktY2ktb25seS1rZXktY2ktb25seTE=
      TEST_DATABASE_URL: postgresql://salon_app:salon_app_dev_pw@localhost:5432/salon
      TEST_ADMIN_DATABASE_URL: postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - name: Create least-privilege roles (same script as local docker-compose)
        run: PGPASSWORD=ci_only psql -h localhost -U postgres -d salon -f ../../infra/postgres/init/01-roles.sql
      - name: Apply migrations as the migrator role
        run: DIRECT_URL="postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon" DATABASE_URL="postgresql://salon_migrator:salon_migrator_dev_pw@localhost:5432/salon" npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Security e2e (auth, RBAC, tenancy, rate limits) against real PostgreSQL
        run: npm run test:e2e
      - run: npm run build
      - name: Dependency audit (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  flutter-core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/flutter_core } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Newer Flutter (3.47+) reports package:flutter/material.dart as a deprecated INFO. Infos no longer fail the job;
      # warnings and errors still do. The material_ui migration is a separate, planned change.
      - run: flutter analyze --no-fatal-infos

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  backup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the backup, restore and smoke-test scripts
        run: shellcheck infra/backup/backup.sh infra/backup/restore-drill.sh infra/deploy/smoke-test.sh

  # ---- Phase 16: deployment artefacts must keep building
  deploy-artifacts:
    runs-on: ubuntu-latest
    env:
      REDIS_PASSWORD: ci_only_redis_password
      API_DOMAIN: api.ci.invalid
      ADMIN_DOMAIN: admin.ci.invalid
      ACME_EMAIL: ci@ci.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (runtime and tools targets)
        run: |
          docker build -f apps/api/Dockerfile --target runtime -t salon-api:ci apps/api
          docker build -f apps/api/Dockerfile --target tools -t salon-api-tools:ci apps/api
      - name: Build the admin web image
        run: docker build -f apps/admin-web/Dockerfile -t salon-web:ci .
      - name: Validate the Caddyfile
        run: docker run --rm -e API_DOMAIN -e ADMIN_DOMAIN -e ACME_EMAIL -v "$PWD/infra/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate the production compose file
        working-directory: infra/deploy
        run: |
          cp .env.api.example .env.api
          cp .env.migrate.example .env.migrate
          docker compose -f docker-compose.prod.yml config --quiet

  mobile-release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tool/prepare-mobile-release.test.mjs
