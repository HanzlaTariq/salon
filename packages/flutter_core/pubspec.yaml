name: flutter_core
description: Shared design system, auth client and core widgets for the Salon Customer and Business apps.
publish_to: none
version: 0.3.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  # Phase 10: push notifications. Needs the Firebase files of each app (see docs/PHASE10.md); without them the app runs with the in-app inbox only.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
