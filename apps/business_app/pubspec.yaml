name: salon_business
description: Salon owner and staff mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_core:
    path: ../../packages/flutter_core
  http: ^1.2.2
  image_picker: ^1.1.2
  # Phase 11: print / save / share the PDF poster, share the QR image and link.
  printing: ^5.13.4
  share_plus: ^10.1.4
  # Phase 12: offline-first. SQLite through Drift (code generation: `dart run build_runner build`), network detection.
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
